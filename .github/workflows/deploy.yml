name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build site
        run: npm run build
      - name: Unzip ready files
        run: |
          unzip dist/public/phlogiston.zip -d public_html
          cp dist/public/phlogiston.zip public_html/phlogiston.zip
          cp -r dist/public/installed public_html/installed
          cp -r dist/public/pinned public_html/pinned
          for manifest in public_html/manifest.webmanifest public_html/manifest.json; do
            jq '.start_url = "./installed/"' "$manifest" > "$manifest.tmp"
            mv "$manifest.tmp" "$manifest"
          done
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        id: pages-artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public_html'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/github-script@v8
        timeout-minutes: 11
        env:
          PAGES_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
        with:
          script: |
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              throw new Error("The Pages upload did not return a valid artifact ID.");
            }

            const { data: deployment } = await github.request(
              "POST /repos/{owner}/{repo}/pages/deployments",
              {
                ...context.repo,
                artifact_id: artifactId,
                pages_build_version: context.sha,
                oidc_token: await core.getIDToken(),
              },
            );
            const deploymentId = deployment.id ?? deployment.status_url?.split("/").at(-1) ?? context.sha;
            core.setOutput("page_url", deployment.page_url);
            core.info(`Created Pages deployment ${deploymentId}.`);

            const failureStatuses = new Set([
              "deployment_failed",
              "deployment_content_failed",
              "deployment_cancelled",
              "deployment_lost",
            ]);
            for (let attempt = 0; attempt < 60; attempt++) {
              await new Promise((resolve) => setTimeout(resolve, 10_000));
              const { data: { status } } = await github.request(
                "GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}",
                { ...context.repo, deploymentId },
              ).catch((error) => {
                if (error.status !== 404 && !(error.status >= 500)) throw error;
                return { data: { status: "not_available" } };
              });
              if (status === "succeed") return;
              if (failureStatuses.has(status)) throw new Error(`Pages deployment status: ${status}`);
              core.info(`Pages deployment status: ${status}`);
            }
            throw new Error("Timed out waiting for GitHub Pages to publish the site.");
