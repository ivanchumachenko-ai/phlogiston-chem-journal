name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build site
        run: npm run build
      - name: Unzip ready files
        run: |
          unzip dist/public/phlogiston.zip -d public_html
          cp dist/public/phlogiston.zip public_html/phlogiston.zip
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        id: pages-artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public_html'
      - name: Wait for the Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
        run: |
          for attempt in {1..15}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" \
              --jq '.artifacts[].id' | grep -Fxq "$PAGES_ARTIFACT_ID"; then
              exit 0
            fi
            sleep 4
          done
          echo "::error::GitHub Pages artifact $PAGES_ARTIFACT_ID is still missing from the Actions API."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
